name: Build Standalone Installers (Windows EXE & Android APK)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'برچسب نسخه آزمایشی یا نهایی (مثال: v1.4.0-test.1 یا v1.4.0)'
        required: true
        default: 'v1.4.0-test.1'
      publish_release:
        description: 'انتشار خروجی‌ها در صفحه GitHub Releases'
        type: boolean
        default: true
      is_prerelease:
        description: 'ثبت به‌عنوان نسخه آزمایشی (Pre-release) پیش از تأیید نهایی'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows Installer (Daftar-Fani-Golzar-Setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root web dependencies
        run: npm install

      - name: Build production web bundle for Desktop (relative base)
        shell: pwsh
        env:
          NATIVE_BUILD: 'true'
        run: npm run build

      - name: Install Electron builder workspace dependencies
        working-directory: electron
        run: npm install

      - name: Stage and verify Electron build assets
        working-directory: electron
        shell: pwsh
        run: |
          npm run stage
          if (!(Test-Path "dist/index.html") -or !(Test-Path "build-resources/icon.ico")) {
            Write-Error "Electron staged assets are missing!"
            exit 1
          }

      - name: Build Windows Per-User NSIS Setup EXE
        working-directory: electron
        run: npm run dist:win

      - name: Verify Daftar-Fani-Golzar-Setup.exe output
        shell: pwsh
        run: |
          if (!(Test-Path "release-desktop/Daftar-Fani-Golzar-Setup.exe")) {
            Write-Error "Daftar-Fani-Golzar-Setup.exe was not generated!"
            exit 1
          }
          Get-Item "release-desktop/Daftar-Fani-Golzar-Setup.exe" | Select-Object Name, Length

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Fani-Golzar-Windows-EXE
          path: release-desktop/Daftar-Fani-Golzar-Setup.exe
          if-no-files-found: error

  build-android-apk:
    name: Build Android Installer (Daftar-Fani-Golzar.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root web dependencies
        run: npm install

      - name: Build production web bundle for Android (relative base)
        env:
          NATIVE_BUILD: 'true'
        run: npm run build

      - name: Install Capacitor Android tooling & native export/share plugins
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/splash-screen@7

      - name: Initialize Capacitor Android project and sync assets
        run: |
          npx cap add android
          node scripts/prepare-android-resources.mjs
          npx cap sync android

      - name: Build, Align, Sign, and Verify Android Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease

          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "${BUILD_TOOLS_DIR}/apksigner" ]; then
            yes | sdkmanager "build-tools;35.0.0" > /dev/null
            BUILD_TOOLS_DIR="$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          fi
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          echo "Using Android Build Tools: ${BUILD_TOOLS_DIR}"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          fi
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: Release APK output not found!"
            exit 1
          fi

          mkdir -p ../release-android
          ALIGNED_APK="../release-android/Daftar-Fani-Golzar-aligned.apk"
          FINAL_APK="../release-android/Daftar-Fani-Golzar.apk"
          KEYSTORE_PATH="/tmp/daftar-fani-release.keystore"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Signing Release APK with permanent repository keystore secret."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not configured; generating a clean non-debuggable PKCS12 release keystore for this build. Configure permanent signing secrets for seamless future in-place upgrades."
            KS_PASS="DaftarFaniGolzarRelease2026"
            KEY_ALIAS="daftarfani"
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Daftar Fani Golzar, OU=Technical Office, O=Golzar Shohada, L=Tehran, C=IR"
          fi

          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${KS_PASS}" \
            --key-pass "pass:${KEY_PASS}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"
          rm -f "$ALIGNED_APK" "$KEYSTORE_PATH" "${FINAL_APK}.idsig"
          ls -lh "$FINAL_APK"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Fani-Golzar-Android-APK
          path: release-android/Daftar-Fani-Golzar.apk
          if-no-files-found: error

  publish-github-release:
    name: Publish Installers to GitHub Releases
    runs-on: ubuntu-latest
    needs: [build-windows-exe, build-android-apk]
    if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
    steps:
      - name: Download Windows EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: Daftar-Fani-Golzar-Windows-EXE
          path: release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Daftar-Fani-Golzar-Android-APK
          path: release-assets

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum Daftar-Fani-Golzar-Setup.exe Daftar-Fani-Golzar.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag & Prerelease Flag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.is_prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: دفتر فنی اداره گلزار شهدا — ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body: |
            ## فایل‌های نصبی مستقل نرم‌افزار «دفتر فنی اداره گلزار شهدا»

            - **نسخه مستقل ویندوز (اولویت اول)**: `Daftar-Fani-Golzar-Setup.exe` (نصب Per-User بدون نیاز به دسترسی Administrator، ذخیره واقعی داده‌ها در `D:\Daftar-Fani-Golzar`)
            - **نسخه مستقل اندروید (دستگاه مکمل)**: `Daftar-Fani-Golzar.apk`
            - **نسخه وب آنلاین (حفظ‌شده)**: https://forog1980-star.github.io/Daftar-Fani-Golzar-App/

            > تمامی کلیدهای امضا و اطلاعات حساس خارج از مخزن نگه داشته شده‌اند.
          files: |
            release-assets/Daftar-Fani-Golzar-Setup.exe
            release-assets/Daftar-Fani-Golzar.apk
            release-assets/SHA256SUMS.txt
