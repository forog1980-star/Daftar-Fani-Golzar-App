appId: ir.golzar.daftarfani.desktop
productName: دفتر فنی اداره گلزار شهدا
copyright: دفتر فنی اداره گلزار شهدا
directories:
  output: ../release-desktop
  buildResources: build-resources
files:
  - main.cjs
  - preload.cjs
  - storagePolicy.cjs
  - package.json
  - dist/**/*
  - build-resources/icon.ico
  - build-resources/icon.png
  - "!stage-assets.cjs"
extraMetadata:
  main: main.cjs
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.ico
  artifactName: Daftar-Fani-Golzar-Setup.exe
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: دفتر فنی اداره گلزار شهدا
  uninstallDisplayName: دفتر فنی اداره گلزار شهدا
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  installerHeaderIcon: build-resources/icon.ico
  deleteAppDataOnUninstall: false
